<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>MockInterview</title>
    <script>
      (function () {
        var base = "/mockinterview";
        var path = window.location.pathname;
        if (path.indexOf(base) !== 0) return;
        var rest = path.slice(base.length);
        if (rest.length > 1 && rest.charAt(rest.length - 1) !== "/") {
          window.location.replace(
            base + rest + "/" + window.location.search + window.location.hash,
          );
        }
      })();
    </script>
  </head>
  <body>
    <p>
      Cette adresse n'existe pas.
      <a href="/mockinterview/">Retour à l'accueil</a>
    </p>
  </body>
</html>
